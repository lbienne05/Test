<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon navigateur</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    header {
      padding: 24px;
      text-align: center;
      background: #fff;
    }

    form {
      display: flex;
      gap: 8px;
      max-width: 600px;
      margin: 20px auto 0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      cursor: pointer;
    }

    #message {
      color: #9b1c1c;
      font-size: 14px;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 155px);
      border: 0;
      background: white;
    }
  </style>
</head>

<body>
  <header>
    <h1>Où veux-tu aller ?</h1>

    <form id="form">
      <input id="site" placeholder="Ex. https://example.com" required>
      <button type="submit">Afficher ici</button>
    </form>

    <p id="message"></p>
  </header>

  <iframe
    id="page"
    title="Site affiché dans la page"
    src="about:blank"
  ></iframe>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("site");
    const frame = document.getElementById("page");
    const message = document.getElementById("message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      let address = input.value.trim();

      if (!address.startsWith("https://") && !address.startsWith("http://")) {
        address = "https://" + address;
      }

      try {
        const url = new URL(address);
        if (!url.hostname.includes(".")) throw new Error();
        frame.src = url.href;
        message.textContent =
          "Si le site l’interdit, il ne pourra pas s’afficher ici.";
      } catch {
        message.textContent = "Entre une adresse de site valide.";
      }
    });
  </script>
</body>
</html>
